services:

  # ── NGINX — reverse proxy, routes traffic to active slot ──────────
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - generator-agent-blue
      - validation-agent-blue
      - planner-agent-blue
      - file-writer-agent

  # ── BLUE SLOT — current live version ─────────────────────────────
  generator-agent-blue:
    build:
      context: .
      dockerfile: apps/generator-agent/Dockerfile
    environment:
      - NODE_ENV=production
      - PORT=3000
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=agent
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=agentdb
      - TYPEORM_SYNC=true
      - VALIDATION_AGENT_URL=http://validation-agent-blue:3000
      - FILE_WRITER_URL=http://file-writer-agent:3000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - postgres
      - redis
      - file-writer-agent

  validation-agent-blue:
    build:
      context: .
      dockerfile: apps/validation-agent/Dockerfile
    environment:
      - NODE_ENV=production
      - PORT=3000
    depends_on:
      - postgres
      - redis

  planner-agent-blue:
    build:
      context: .
      dockerfile: apps/planner-agent/Dockerfile
    environment:
      - NODE_ENV=production
      - PORT=3000
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=agent
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=agentdb
      - TYPEORM_SYNC=true
      - GENERATOR_AGENT_URL=http://generator-agent-blue:3000
    depends_on:
      - postgres
      - generator-agent-blue

  # ── GREEN SLOT — new version (standby until switched) ────────────
  generator-agent-green:
    build:
      context: .
      dockerfile: apps/generator-agent/Dockerfile
    environment:
      - NODE_ENV=production
      - PORT=3000
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=agent
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=agentdb
      - VALIDATION_AGENT_URL=http://validation-agent-green:3000
      - FILE_WRITER_URL=http://file-writer-agent:3000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - postgres
      - redis
      - file-writer-agent
    profiles:
      - green

  validation-agent-green:
    build:
      context: .
      dockerfile: apps/validation-agent/Dockerfile
    environment:
      - NODE_ENV=production
      - PORT=3000
    depends_on:
      - postgres
      - redis
    profiles:
      - green

  planner-agent-green:
    build:
      context: .
      dockerfile: apps/planner-agent/Dockerfile
    environment:
      - NODE_ENV=production
      - PORT=3000
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=agent
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=agentdb
      - TYPEORM_SYNC=true
      - GENERATOR_AGENT_URL=http://generator-agent-green:3000
    depends_on:
      - postgres
      - generator-agent-green
    profiles:
      - green

  # ── FILE WRITER — shared service, not blue-green (stateless + volume) ──
  file-writer-agent:
    build:
      context: .
      dockerfile: apps/file-writer-agent/Dockerfile
    environment:
      - NODE_ENV=production
      - PORT=3000
      - OUTPUT_DIR=/app/output
    volumes:
      - generated_output:/app/output

  # ── INFRASTRUCTURE — shared by both slots ─────────────────────────
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: password
      POSTGRES_DB: agentdb
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
  generated_output:
